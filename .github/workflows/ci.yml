name: CI

on:
  pull_request:
    branches:
      - stage
      - release
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Run as two steps so the log shows plainly that both suites ran.
      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Feature Tests
        run: npm run test:feature

      # Full suite once more, for the combined coverage report.
      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
