<!doctype html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"

<head>
  <meta charset="utf-8" />
  <!-- Link-preview tags (title, description, Open Graph, favicon) for this
       partner's domain. Previews never run JavaScript, so Nginx fills these in
       with an SSI include of the API's /api/portal-meta. The block is the stub:
       the packaged defaults, served if that call fails and wherever SSI is off.
       It has to sit before the include, and both before the branding script
       below, which then updates these tags instead of adding a second set.
       The packaged favicon stays outside the block (Vite fingerprints its path);
       the API adds a partner favicon only when there is one, after this one,
       and the later icon is the one the tab shows. -->
  <link rel="icon" href="/assets/images/Favicon.png" />
  <!--# block name="portal_meta_default" -->
  <title>Four Corner Funding | Partner Portal</title>
  <meta name="description" content="Sign in to the Four Corner Funding partner portal to manage your borrowers and their funding." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Four Corner Funding" />
  <meta property="og:title" content="Four Corner Funding | Partner Portal" />
  <meta property="og:description" content="Sign in to the Four Corner Funding partner portal to manage your borrowers and their funding." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Four Corner Funding | Partner Portal" />
  <meta name="twitter:description" content="Sign in to the Four Corner Funding partner portal to manage your borrowers and their funding." />
  <!--# endblock -->
  <!--# include virtual="/__portal-meta" stub="portal_meta_default" -->
  <script>
    (function () {
      // Paints the tenant's brand before React mounts.
      //
      // The variable map is precomputed and persisted by applyBrandTheme() in
      // src/utils/brandingTheme.ts, so there is deliberately no colour maths and
      // no knowledge of the branding schema here - an earlier version duplicated
      // both and drifted out of sync. Applying a map blindly cannot drift.
      try {
        // A COLD visit - nothing in localStorage yet - is the case that used to
        // flash the packaged default brand until the theme request landed. Ask
        // the API for this tenant's brand as a stylesheet, first thing: a <link>
        // appended while the head is still parsing blocks the first paint, so the
        // right colours are there before anything renders.
        //
        // Inserted from script rather than written statically because the API has
        // to be told which portal is asking, and only the browser knows the
        // hostname. Vite substitutes the API base at build time.
        //
        // Ordering with the cached map below is deliberate: that path sets inline
        // styles on :root, which outrank this stylesheet, so a repeat visitor
        // still paints instantly from localStorage and this only decides the
        // cold case.
        var apiBase = '%VITE_BASE_API_URL%';
        if (apiBase && apiBase.charAt(0) !== '%') {
          var brandLink = document.createElement('link');
          brandLink.rel = 'stylesheet';
          brandLink.href = apiBase + '/api/branding.css?d=' + encodeURIComponent(location.hostname);
          document.head.appendChild(brandLink);
        }

        var cached = localStorage.getItem('brand-css-vars');
        if (cached) {
          var brand = JSON.parse(cached);
          if (brand && brand.v === 1 && brand.vars) {
            var style = document.documentElement.style;
            for (var name in brand.vars) {
              if (Object.prototype.hasOwnProperty.call(brand.vars, name)) {
                style.setProperty(name, brand.vars[name]);
              }
            }
          }
        }

        // Title and favicon still come from the persisted config store.
        var storeStr = localStorage.getItem('app-config-store');
        if (storeStr) {
          var parsed = JSON.parse(storeStr);
          var branding = parsed && parsed.state && parsed.state.branding;
          if (branding) {
            var fav = branding.favicon_full_url || branding.favicon;
            if (fav && fav !== 'null') {
              var existing = document.querySelector("link[rel~='icon']");
              if (existing) { existing.href = fav; }
              else {
                var favLink = document.createElement('link');
                favLink.rel = 'icon';
                favLink.href = fav;
                document.head.appendChild(favLink);
              }
            }
            // Same wording as src/config/portalMeta.ts and the API's portal-meta.
            if (branding.site_name && branding.site_name !== 'null') {
              document.title = branding.site_name + ' | Partner Portal';
            }
          }
        }
      } catch (e) {
        console.error('Branding initialization error:', e);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- jsvectormap css -->
