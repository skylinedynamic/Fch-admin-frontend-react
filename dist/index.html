<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var storeStr = localStorage.getItem('app-config-store');
        if (storeStr) {
          var parsed = JSON.parse(storeStr);
          if (parsed && parsed.state && parsed.state.branding) {
            var branding = parsed.state.branding;
            var primary = branding.primary_color;
            var secondary = branding.secondary_color || '#F7B84B';
            if (primary && primary !== 'null') {
              document.documentElement.style.setProperty('--primary-color', primary);
            }
            if (secondary && secondary !== 'null') {
              document.documentElement.style.setProperty('--secondary-color', secondary);
            }
            // Dynamic favicon from cached branding
            var fav = branding.favicon_full_url || branding.favicon;
            if (fav && fav !== 'null') {
              var existing = document.querySelector("link[rel~='icon']");
              if (existing) { existing.href = fav; }
              else {
                var favLink = document.createElement('link');
                favLink.rel = 'icon';
                favLink.href = fav;
                document.head.appendChild(favLink);
              }
            }
            if (branding.site_name) {
              document.title = branding.site_name;
            }
          }
        }
      } catch (e) {
        console.error('Branding initialization error:', e);
      }
    })();
  </script>
